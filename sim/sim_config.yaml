# Paths inside the twin. The organizers' starter (fanuc_er4ia_hackathon_starter_v05/fanuc_er4ia_sim) builds
# the scene in code: run its build_scene.py --headless --save <file>.usd, then point usd_path at that file.
# Prim and joint names below are the starter's (cell.py, scene_config.py); run sim/explore_twin.py to confirm.
usd_path: /workspace/twincheck_scene.usd                # sim/build_twincheck_scene.py --headless --save <this>

robot:
  articulation: /World/ER4iA                             # starter scene_config.ROBOT_PRIM
  tool_link: /World/ER4iA/J6_link                        # flange (wrist centre); the fingertip is 293 mm along +x
  finger_joints: [jaw_l, jaw_r]                          # starter cell.JAW_JOINTS: prismatic, metres, 0 = open
  finger_open: [0.0, 0.0]
  finger_closed: [-0.006, 0.006]                         # 6 mm travel per jaw (cell.jaw_targets)

cameras:
  table: /World/TableCam
  side: /World/SideCam
  wrist: /World/ER4iA/J6_link/WristCam
  resolution: [1920, 1080]                               # the real table/side cameras; the wrist is 1280 x 720

objects:            # one prim per class in the sorting scene (build_twincheck_scene.py); copies are made for
                    # clutter. These are the detector's classes. Vials and caps are not in the scene (too wide
                    # for the jaws): add them back here and in the scene builder only with custom fingers.
  cube: /World/SortCube0                                 # 10 mm (starter CUBE_EDGE)
  screw: /World/Screw0                                   # added by sim/build_twincheck_scene.py

origins:            # where each prim's origin sits on the part (checked Oct 22 with explore_twin; twin_common.place_part)
  cube: bottom_centre                                    # centre of the bottom face, on the surface
  screw: head_face_lying                                 # centre of the head face; lying, tip along +yaw

table:
  # area on the table where objects are randomized, robot_base frame, mm
  x_range_mm: [240, 460]                                 # starter work area; reach and table view are fine here
  y_range_mm: [-150, 180]                                # keeps clear of the bins (y 205-275)
  surface_z_mm: 894.9                                    # world z of the work surface (base at 0.90 m, surface 5.1 mm below)
  stage_units_per_mm: 0.001                              # USD stage in meters (check metersPerUnit)

lights: [/World/DomeLight, /World/KeyLight, /World/FillLight, /World/RimLight]   # starter's; varied around their intensity

ros:
  domain_id: 0
  publish_hz: 15
