[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twincheck-core"
version = "0.1.0"
description = "TwinCheck check logic: geometry, checks, comparator, resync, stats"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["twincheck_core"]
